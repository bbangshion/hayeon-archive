name: HAYEON - PHOTO FILM TIMELINE Master Upgrade V2
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Preview before applying; no media/objekt data overwritten
        required: true
        type: choice
        options:
        - preview
        - apply
        default: preview
permissions:
  contents: write
concurrency:
  group: hayeon-master-media-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.ref == 'refs/heads/main' && github.repository == 'bbangshion/hayeon-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout HAYEON source
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify current source and stage UI-only patch
      env:
        UPGRADE_MODE: ${{ inputs.mode }}
      shell: bash
      run: |
        python - <<'PY'
        import base64, hashlib, io, json, os, pathlib, zipfile
        ROOT=pathlib.Path('.')
        MODE=os.environ['UPGRADE_MODE']
        if MODE not in ('preview','apply'): raise SystemExit('Unsupported mode')
        manifest=json.loads('{"target":"hayeon-archive","expected_original_sha256":{"src/components/PhotoArchive.tsx":"ccbedeb646d30dd3f1776ffba61cea2c859502b8faf285c037b4d428e7dff3be","src/components/TimelinePage.tsx":"ff26b540453b3608ba424d712ae69589a18a63b1857f127a5964e1538c7f7d86","src/lib/films.ts":"690897a1c47c74d13a00a5909a1c2031e392c3968a18473588b074655b4b9d74","src/lib/activityCatalog.ts":"9e0e2f09e365f132b8987a57fb1291992ca5e3d5035f6e817c517caf45c30c30","src/App.tsx":"e28b3ab25ad304c8d13f0b3cf6830ef47dffd6027fc1972d2c074063feb5b564","public/data/hayeon-activities.json":"6e57d1e5db2684ac1b21e5131db34608ab395d9053781501324c946ed60957fe"},"patch_sha256":{"src/components/PhotoArchive.tsx":"033ad7cf803403cca0b1f694d90f05ad840cf3b9cde469f9aaa19f79d208f620","src/components/hayeon-photo-v4.css":"591606aaa35366f461bee571a187d7017e79bea70ae30a4988482ae1c10c0d36","src/components/TimelinePage.tsx":"76eae232a33656d23b89ffeaca2cb4fbc9aeb93a40d95710efba61f75a85ceec","src/components/hayeon-timeline-v3.css":"8057178cd3005c79532ec19057ce26d18071f4b2449ce37ad12fc5bb529fd018","src/components/HayeonFilm.tsx":"8f43cdb6a76856f9bd433211a150aa5df6ed3b084bce58271dd17c24472099a2","src/components/hayeon-film.css":"049b36fefd306b4cf5984616ae979e9a5eed0a5a643af52f526a5f51bb74de91","src/i18n/hayeon-film-messages.ts":"a67d2bf098e844850a227488a564cbb1dd2e8c0c5b39144f014e79a1b2da9d67","src/lib/films.ts":"e90f9fb2a526fc02931449c1f2fb3b5502d7e455897b22ddd378361050efefaf","src/lib/activityCatalog.ts":"70b6cf7c2d3533cca5b03795d47ed0391f72bfccd42ad45332fb269ddc75bfe3","src/App.tsx":"d4714a2f99e261f64cdb03cd512d6607233527d28a096a8d33ec640f9b33d100","public/data/hayeon-activities.json":"b107d92daffbfa239f42d4e9badd5138150f7954fb83c76f7bf4c0bf04dc39fe","public/gallery/index.html":"43dcf6acffc5b28872ca30341ca20a6be97ac14d0a931c3cd04aca9571cfb181"},"files":["src/components/PhotoArchive.tsx","src/components/hayeon-photo-v4.css","src/components/TimelinePage.tsx","src/components/hayeon-timeline-v3.css","src/components/HayeonFilm.tsx","src/components/hayeon-film.css","src/i18n/hayeon-film-messages.ts","src/lib/films.ts","src/lib/activityCatalog.ts","src/App.tsx","public/data/hayeon-activities.json","public/gallery/index.html"]}')
        blob=base64.b64decode('')
        if hashlib.sha256(blob).hexdigest()!='471c9e482dbbf3d557a7a647084fd43653df6ec6584e8d57cb5485ac19a66288':raise SystemExit('Embedded patch checksum mismatch')
        z=zipfile.ZipFile(io.BytesIO(blob))
        if set(z.namelist()) != set(manifest['files']):raise SystemExit('Patch allowlist mismatch')
        guarded={'src/App.tsx','src/lib/films.ts','src/lib/activityCatalog.ts','src/components/PhotoArchive.tsx','src/components/TimelinePage.tsx','public/data/hayeon-activities.json'}
        for name in manifest['files']:
            target=ROOT/name
            if not name.startswith(('src/','public/gallery/','public/data/hayeon-activities.json')):
                raise SystemExit('Unexpected output path: '+name)
            data=z.read(name)
            if hashlib.sha256(data).hexdigest()!=manifest['patch_sha256'][name]:raise SystemExit('File hash mismatch: '+name)
            if name in guarded:
                if not target.is_file():raise SystemExit('Missing expected original file: '+name)
                current=hashlib.sha256(target.read_bytes()).hexdigest()
                old=manifest['expected_original_sha256'][name]
                if current not in (old,manifest['patch_sha256'][name]):
                    raise SystemExit('STOP: '+name+' differs from uploaded HAYEON ZIP; upload current code before reapplying')
            elif target.exists() and hashlib.sha256(target.read_bytes()).hexdigest()!=manifest['patch_sha256'][name]:
                raise SystemExit('STOP: local custom file already exists: '+name)
        for name in manifest['files']:
            if name.endswith(('/photos.json','/films.json','/objekt.json')):raise SystemExit('STOP: forbidden data overwrite')
        print('S19 source checks passed. Patch files:',len(manifest['files']))
        if MODE=='preview':
            print('PREVIEW ONLY: no files changed')
            for name in manifest['files']:print(' -',name)
        else:
            for name in manifest['files']:
                file=ROOT/name
                file.parent.mkdir(parents=True,exist_ok=True)
                file.write_bytes(z.read(name))
            print('Applied HAYEON UI patch')
        PY
    - name: Setup Node 22
      if: inputs.mode == 'apply'
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Audit HAYEON member data
      if: inputs.mode == 'apply'
      run: node scripts/audit-hayeon.mjs
    - name: Install and build
      if: inputs.mode == 'apply'
      run: |-
        npm install --no-audit --no-fund
        npm run build
    - name: Commit target files only
      if: inputs.mode == 'apply'
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -- src/components/PhotoArchive.tsx src/components/hayeon-photo-v4.css src/components/TimelinePage.tsx src/components/hayeon-timeline-v3.css src/components/HayeonFilm.tsx src/components/hayeon-film.css src/i18n/hayeon-film-messages.ts src/lib/films.ts src/lib/activityCatalog.ts src/App.tsx public/data/hayeon-activities.json public/gallery/index.html
        git diff --cached --quiet && { echo 'No new changes'; exit 0; }
        git commit -m 'ui: upgrade HAYEON photo film and timeline like YEONJI'
        git push origin "HEAD:${GITHUB_REF_NAME}"

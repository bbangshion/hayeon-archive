name: HAYEON - YEONJI MASTER UI SYNC V2 SAFE
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview validates and builds without committing. Apply commits UI changes and deploys."
        required: true
        type: choice
        options:
          - preview
          - apply
        default: preview
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: family-v2-hayeon-${{ github.ref }}
  cancel-in-progress: false
jobs:
  design:
    runs-on: ubuntu-latest
    steps:

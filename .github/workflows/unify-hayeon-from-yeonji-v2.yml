          blob = zlib.decompress(base64.b64decode(''.join(encoded.split())))
          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              manifest = json.loads(archive.read('.family-sync-manifest.json'))
              assert manifest['member'] == 'hayeon' and manifest['member_id'] == 'S19'
              allow = manifest['allowed_paths']
              assert sorted(allow) == sorted(manifest['checksums'])
              assert sorted(allow) == sorted(set(allow))
              # NO TOUCH to business logic, JSON, API, handlers, favorites, world cup, data.
              forbidden = ('public/data/', 'src/lib/', 'src/hooks/', 'src/state/', 'scripts/')
              forbid_files = ('src/App.tsx','src/components/TournamentArena.tsx',
                              'src/components/Collection.tsx', 'src/components/ProfilePage.tsx',
                              'src/components/TimelinePage.tsx')
              for name in allow:
                  if name.startswith(forbidden) or name in forbid_files or name.startswith('/') or '..' in pathlib.PurePosixPath(name).parts:
                      raise SystemExit('Unexpected protected path in patch: ' + name)
              # Fail closed on source-version drift; do not silently overwrite new GitHub edits.
              for name in allow:
                  path = ROOT / name
                  record = manifest['checksums'][name]
                  now = hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None
                  if now not in (record['before'], record['after']):
                      raise SystemExit('SOURCE CHANGED since uploaded ZIP: ' + name + '; download fresh repo ZIP for rebase')
              # A captured protection map proves core files were not modified by this workflow.
              important = [p for folder in ('src/lib','src/hooks','src/state','public/data','scripts')
                           for p in (ROOT/folder).rglob('*') if p.is_file()]
              important += [ROOT/f for f in ('src/App.tsx','src/components/TournamentArena.tsx',
                           'src/components/Collection.tsx','src/components/ProfilePage.tsx',
                           'src/components/TimelinePage.tsx') if (ROOT/f).is_file()]
              protect = {str(p.relative_to(ROOT)):hashlib.sha256(p.read_bytes()).hexdigest() for p in important}
              pathlib.Path('/tmp/archive-family-logic-sha.json').write_text(json.dumps(protect))
              for name in allow:
                  target = ROOT / name
                  target.parent.mkdir(parents=True,exist_ok=True)
                  data = archive.read(name)
                  if hashlib.sha256(data).hexdigest() != manifest['checksums'][name]['after']:
                      raise SystemExit('Payload checksum mismatch: ' + name)
                  target.write_bytes(data)
              # Verify protection map after applying patch, before installing dependencies.
              for name,sha in protect.items():
                  if hashlib.sha256((ROOT/name).read_bytes()).hexdigest()!=sha:
                      raise SystemExit('PROTECTED CONTENT MODIFIED: '+name)
              print('ARCHIVE FAMILY V2 | HAYEON | '+mode+' | '+str(len(allow))+' design files patched; member S19; protected logic intact')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## HAYEON — YEONJI master UI safe sync\n\n')
                  f.write('- Mode: **'+mode+'**\n- Design files: **'+str(len(allow))+'**\n')
                  f.write('- App / data / collection / tournament / profile logic: **untouched**\n')
                  f.write('- GitHub commit and Pages: **apply only**\n')
          PY
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and validate TypeScript + Vite
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
      - name: Recheck protected business-logic files after build
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          original=json.loads(pathlib.Path('/tmp/archive-family-logic-sha.json').read_text())
          for name,sha in original.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==sha, 'PROTECTED CONTENT MODIFIED: '+name
          print('PASS: '+str(len(original))+' existing protected source/data files unchanged')
          PY
      - name: Commit only changed design files (apply mode)
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/gallery/family.html src/archive-family-sync-v2.css src/archive-family.css src/components/PhotoArchive.tsx src/main.tsx
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: align HAYEON presentation with YEONJI master v2'
            git push origin HEAD:main
          else
            echo 'UI files already match master family V2.'
          fi
      - name: Configure GitHub Pages
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/configure-pages@v5
      - name: Upload validated site build
        if: ${{ inputs.mode == 'apply' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: ${{ inputs.mode == 'apply' }}
    needs: design
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated Vite site
        id: deployment
        uses: actions/deploy-pages@v4

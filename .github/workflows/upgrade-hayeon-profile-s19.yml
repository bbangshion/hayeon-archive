name: HAYEON - Profile Upgrade
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Patch profile only
      run: |-
        python3 - <<'PYCODE'
        import pathlib, hashlib, base64
        p = pathlib.Path('src/components/ProfilePage.tsx')
        new = base64.b64decode('')
        if p.read_bytes() != new:
            if hashlib.sha256(p.read_bytes()).hexdigest() != '9d87bf64d76387515f4b8d6e3b9fe3247565f45b7940673e7bb7dff80dbbe2c6':
                raise SystemExit('STOP: ProfilePage has changed since source snapshot. No overwrite.')
            p.write_bytes(new)
        PYCODE
    - run: |-
        npm install --no-audit --no-fund
        npm run build
    - name: Commit profile
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/components/ProfilePage.tsx
        if git diff --cached --quiet; then exit 0; fi
        git commit -m "Expand S19 profile"
        git push

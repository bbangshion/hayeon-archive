name: HAYEON - Sync YEONJI Master Design (UI Only)
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: preview = no changes / apply = CSS-only + production build
        type: choice
        options:
        - preview
        - apply
        default: preview
        required: true
permissions:
  contents: write
concurrency:
  group: hayeon-master-design
  cancel-in-progress: false
jobs:
  unify:
    if: github.repository == 'bbangshion/hayeon-archive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out HAYEON
      uses: actions/checkout@v4
    - name: Apply or preview UI-only synchronisation
      env:
        MODE: ${{ inputs.mode }}
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport base64, zlib, hashlib, os, sys\nroot = Path.cwd()\nmode = os.environ.get('MODE',\
        \ 'preview')\nassert mode in ('preview','apply')\nsource = (root/'src/main.tsx')\napp = (root/'src/App.tsx')\nstyle\
        \ = (root/'src/index.css')\ndata = (root/'public/data/objekt.json')\nif not all(p.is_file() for p in (source,app,style,data)):\n\
        \    sys.exit('STOP: HAYEON source structure differs; no changes made.')\napp_txt = app.read_text(encoding='utf-8')\n\
        main_txt = source.read_text(encoding='utf-8')\nif not ('HAYEON ARCHIVE' in app_txt and 'TRIPLES S19' in app_txt and\
        \ 'hayeon-home.jpg' in app_txt):\n    sys.exit('STOP: not an S19 HAYEON archive; no changes made.')\nif \"import './index.css';\"\
        \ not in main_txt:\n    sys.exit('STOP: entry point does not match inspected source; no changes made.')\ncss = zlib.decompress(base64.b64decode(''.join('''eNqtWf9u5LYR/t9PweYQZDddrSXtrr1eo0CdyzXnJvEV52uLoOgflERJhCVRIKm1N8YBeYg+YZ+kQ1K/qJXsTRpscoao4XBm+M3H\n\
        GWrHGZPoGTkOjh0chqSQO/Rm43979c031+jz2fnX6P3NT+8+3KFzdPPx7fvbf7xDf7n58faHn5DrodmeigpnKGTlAbEYKcG/3qIc\nC0n4HP33l/8gkWJOIkQiKhmnIPv3WxQzju7f32ql9ZRz9Pb9zbt/frhbniGE7nFOQGlesgIMEgsk1IAocUiLBOEiQjmTlBVL9KHI\n\
        Dn3j9cuScckxlQJFNI4J1zpvczWMZEoFimlG0A8395+W6JN6hv8went/j9ie8AwfFujuwycY4oTmZUZyUIzVesrHmGBZcSKWZ1+f\nn+1M+EC/tiFIIHieC7/1dTOWEs7MCzeAH2lfiIrHOCRqxta79KL2BZguSATjvufF/mU7ntECpHkS4Jm/2SxQ98/S8zfzVo4WDzA5\n\
        vohX8aYdzCupdWKCrwK/Zx2OCHfSHbq8KJ/a4UcaSRjzvK3bG+U4opXYoXVvjGABRoVVQEMnID9TwmdLH0zywCr1pzPLbNkO+Ws3\nF9dnn89SmWcAPRFylmVOiaMIdteRrNyhPeYzy765AmPAogNMCHD4kHBWFVFPMEhAJGQZ471BiASMxqyQToxzmh126LYAaC7Q3ziR\n\
        pIgwjxboq5sSNhndf4u+YwCPEN0R9hUM3zHJAIqFQN9/hGdxAFTnTkUVHAvhCMJpfI2cRxI8UFhArSJyplQUsN24kAB3CuGJlO1L\nkYL3jqCS1E6BJymhSSrH3e17qffcg5Dq/9cQ2qu1EmFcSQdMSpbDbpVPSLCMRp0+BZn5+PJLeEwZpNXzK0tdbvsaagtpUagw1oMh\n\

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>HAYEON GALLERY · @bbangshion</title><meta name="color-scheme" content="dark"/>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--paper:#f1f4f1;--muted:#a0a9a5;--line:#313a36;--accent:#52D9BB;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper)}header{position:sticky;z-index:3;top:0;border-bottom:1px solid var(--line);background:#0a0a0cee;backdrop-filter:blur(10px);padding:18px max(18px,calc((100% - 1140px)/2));display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:inherit}header a{text-decoration:none;font-size:12px;letter-spacing:.12em}header b{color:var(--accent);font-size:20px}main{max-width:1140px;margin:auto;padding:46px 18px 90px}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--accent)}h1{font-size:clamp(42px,7vw,80px);font-weight:350;letter-spacing:-.07em;margin:13px 0}p{color:var(--muted);font-size:12px;line-height:1.8}.bar{display:flex;flex-wrap:wrap;gap:10px;padding:28px 0 20px;border-top:1px solid var(--line);margin-top:38px}input,select{height:45px;background:#161c18;color:var(--paper);border:1px solid var(--line);padding:0 13px;min-width:0}input{flex:1 1 200px}select{flex:0 1 180px}.results{font-size:12px;color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 13px}.card{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;min-width:0}.image{aspect-ratio:3/4;display:block;background:#202722;overflow:hidden}.image img{width:100%;height:100%;display:block;object-fit:cover}.card b{display:block;font-size:12px;font-weight:480;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-top:10px}.card small{color:var(--muted);display:block;font-size:10px;margin-top:5px}.more{margin:34px auto 0;display:block;min-width:170px;padding:13px;background:#1c322a;color:var(--paper);border:1px solid var(--accent)}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:99;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:12px 12px max(16px,env(safe-area-inset-bottom));gap:10px}.lightbox[hidden]{display:none}.close{justify-self:end;color:var(--paper);background:#1d2722;border:1px solid #546359;padding:11px 17px}.stage{display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img{max-width:100%;max-height:100%;object-fit:contain}.caption{font-size:12px;line-height:1.7;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.caption a{color:var(--accent)}.err{padding:40px 0;font-size:13px;color:var(--muted)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 10px}header{padding:14px 18px}main{padding-top:30px}.bar{margin-top:25px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><a id="back" href="#">← HAYEON ARCHIVE</a><a href="../"><b>H</b> · GALLERY</a></header><main><span class="eyebrow">S19 / PHOTO COLLECTION</span><h1>HAYEON<br/>GALLERY</h1><p>정하연의 사진 기록 · CREATED BY @bbangshion<br/>원본 사진 저작권은 각 권리자에게 있습니다.</p><div class="bar"><input id="search" type="search" placeholder="사진·활동·키워드 검색" aria-label="검색"/><select id="year" aria-label="연도"><option value="all">전체 연도</option></select><select id="album" aria-label="분류"><option value="all">전체 분류</option></select><select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="old">오래된순</option></select></div><div class="results" id="status" role="status">사진 데이터를 불러오는 중...</div><div class="grid" id="grid"></div><button class="more" id="more" hidden type="button">더 보기</button></main><section id="viewer" class="lightbox" role="dialog" aria-modal="true" aria-label="사진 확대" hidden><button id="close" type="button" class="close">닫기 ×</button><div class="stage"><img id="full" alt=""/></div><div class="caption"><span id="caption"></span><a id="source" href="#" target="_blank" rel="noopener noreferrer" hidden>원본 출처 ↗</a></div></section>
<script>
(()=>{'use strict';const base='../';const $=id=>document.getElementById(id);const imgSafe=s=>typeof s==='string'&&(/^images\/[A-Za-z0-9_.%/\-]+\.(?:webp|png|jpe?g|avif)$/i.test(s)||/^https:\/\//.test(s));const url=s=>s.startsWith('https:')?s:base+s;const text=(v,f='')=>typeof v==='string'?v:((v&&v.ko)||f);const date=v=>typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)?v:null;let photos=[],filtered=[],shown=36,previous=null;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('back').href=base;function build(){const term=$('search').value.trim().toLocaleLowerCase(),year=$('year').value,album=$('album').value;filtered=photos.filter(p=>(year==='all'||p.year===year)&&(album==='all'||p.album===album)&&(!term||`${p.title} ${p.album} ${p.year||''} ${(p.tags||[]).join(' ')}`.toLocaleLowerCase().includes(term)));filtered.sort((a,b)=>(a.date||((a.year||'')+'-00-00')).localeCompare(b.date||((b.year||'')+'-00-00'))*($('sort').value==='old'?1:-1));shown=36;render()}function render(){const slice=filtered.slice(0,shown);const out=$('grid');out.textContent='';const frag=document.createDocumentFragment();slice.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label',p.title+' 확대');const wrap=document.createElement('span');wrap.className='image';const pic=document.createElement('img');pic.src=url(p.thumb||p.image);pic.alt=p.title;pic.loading='lazy';pic.decoding='async';wrap.appendChild(pic);const title=document.createElement('b');title.textContent=p.title;const small=document.createElement('small');small.textContent=p.album+' · '+(p.date||p.year||'날짜 미등록');b.append(wrap,title,small);b.addEventListener('click',()=>open(p));frag.appendChild(b)});out.appendChild(frag);$('status').textContent=`${filtered.length.toLocaleString()}장 / 전체 ${photos.length.toLocaleString()}장`;$('more').hidden=shown>=filtered.length}function open(p){previous=document.activeElement;const v=$('viewer');$('full').src=url(p.image);$('full').alt=p.title;$('caption').textContent=p.title+' · '+(p.date||p.year||'날짜 미등록');const a=$('source');a.hidden=!p.source;a.href=p.source||'#';v.hidden=false;document.body.style.overflow='hidden';$('close').focus()}function close(){const v=$('viewer');v.hidden=true;$('full').removeAttribute('src');document.body.style.overflow='';previous&&previous.focus()};$('close').onclick=close;$('viewer').addEventListener('mousedown',e=>{if(e.target===$('viewer'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('viewer').hidden)close()});$('more').onclick=()=>{shown+=36;render()};for(const id of ['search','year','album','sort'])$(id).addEventListener('input',build);fetch(base+'data/photos.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{const rows=Array.isArray(data)?data:Array.isArray(data.photos)?data.photos:[];const seen=new Set();photos=rows.filter(p=>p&&p.memberId==='S19'&&p.category==='photo'&&typeof p.id==='string'&&imgSafe(p.image)&&!seen.has(p.id)&&seen.add(p.id)).map(p=>({image:p.image,thumb:imgSafe(p.thumbnail)?p.thumbnail:null,title:text(p.title,'정하연'),album:text(p.album,'사진'),date:date(p.date),year:date(p.date)?.slice(0,4)||(/^20\d\d$/.test(p.sourceYear||p.year)?(p.sourceYear||p.year):null),tags:Array.isArray(p.tags)?p.tags:[],source:typeof p.sourceUrl==='string'&&/^https:\/\//.test(p.sourceUrl)?p.sourceUrl:null}));const unique=(a)=>[...new Set(a)].sort().reverse();for(const y of unique(photos.map(p=>p.year).filter(Boolean))){const o=document.createElement('option');o.value=y;o.textContent=y;$('year').appendChild(o)}for(const a of unique(photos.map(p=>p.album).filter(Boolean))){const o=document.createElement('option');o.value=a;o.textContent=a;$('album').appendChild(o)}build()}).catch(e=>{$('status').textContent='사진 데이터를 불러오지 못했습니다: '+String(e.message)})})();
</script></body></html>
